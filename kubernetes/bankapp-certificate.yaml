apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bankapp-cert
  namespace: bankapp-namespace
spec:
  secretName: bankapp-tls-secret          # This secret will be created by cert-manager
  dnsNames:
    - megaproject.magneqdevops.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
